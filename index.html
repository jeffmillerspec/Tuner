<!doctype html><html><head><meta charset=UTF-8><title>Tuner 0.3.0</title><link rel=stylesheet href=/src/styles.css></head><body><div id=app><header><h1>Tuner <span id=app-version>0.3.0</span></h1><select id=theme-select title=Theme aria-label=Theme></select><button id=btn-import type=button>Import</button><input id=file-input type=file accept=audio/*,video/mp4,.mp4,.mp3,.wav,.ogg,.m4a,.flac,.aac,.webm multiple hidden></header><main class=layout><section class=panel><h2>Library</h2><ul id=library-list></ul><p id=library-empty class=empty>No media imported.</p></section><section class=panel><h2>Playlists</h2><select id=playlist-select></select><div class=row><input id=playlist-name placeholder=New playlist><button id=btn-create-playlist type=button>Create</button><button id=btn-rename-playlist type=button>Rename</button></div><p id=playlist-error class=error hidden></p><ul id=playlist-list></ul><p id=playlist-empty class=empty>No playlists.</p></section><section class="panel player-panel"><h2>Now Playing</h2><video id=player controls playsinline muted></video><p id=now-playing>Select a track</p><div class=row><button id=btn-prev type=button>Prev</button><button id=btn-next type=button>Next</button></div></section><section class=panel><h2>Queue</h2><ul id=queue-list></ul><p id=queue-empty class=empty>Queue empty.</p></section></main></div><script type=module src=/src/main.js></script></body></html>
